.alert{border-radius:var(--r);padding:12px 14px;margin:12px 0;display:flex;gap:12px;align-items:flex-start}

.empty{text-align:center;padding:40px 16px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:80;font-size:14px;max-width:calc(100% - 32px)}
.banner{background:var(--warnBg);border-bottom:1px solid var(--line);padding:8px 30px;font-size:13.5px}
.low td{background:var(--badBg)}
.mob-top{display:none}

.auth-card h1{font-size:22px}
.form-err{color:var(--bad);font-size:14px;font-weight:600;min-height:0}
.form-err:empty{display:none}
.center{max-width:460px;margin:12vh auto;text-align:center;padding:0 16px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}

  aside .brand,aside .who{display:none}
  .nav{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 10px;min-width:72px;align-items:center;text-align:center}
  .nav .cnt{margin:0;font-size:10.5px;padding:0 6px}

  .otbl tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"num sum" "cli cli" "cfg cfg" "st pay" "ship ship";gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .otbl tr:last-child{border-bottom:0}

}
</style>

  const T={orders:["orders","Заказы"],shop:["shop","Цех"],stock:["stock","Склад"],reports:["reports","Отчёты"],team:["team","Команда"]};
  const by={admin:["orders","shop","stock","reports","team"],manager:["orders","shop"],lead:["shop","orders","stock"],assembler:["shop","orders"],partner:["stock","orders"]};
  return (by[S.role]||[]).map(k=>T[k]);
}
function fixTab(){const t=tabsFor().map(x=>x[0]);if(!t.includes(S.tab))S.tab=t[0]}
const orderCost=o=>(o.items||[]).reduce((a,i)=>a+(+i.cost||0)*(+i.qty||1),0);
const orderComm=o=>(+o.price||0)*((+(S.settings.commissions||{})[o.pay_method]||0)/100);
const orderProfit=o=>(+o.price||0)-orderCost(o)-orderComm(o)-(+o.deliv_cost||0);
const cfgLine=o=>(o.items||[]).map(i=>i.name+((+i.qty||1)>1?" ×"+i.qty:"")).join(", ")||"Комплектующие не указаны";
const unacked=o=>S.changes.get(o.id)||[];
const overdue=o=>o.ship_by&&o.status!=="cancel"&&SIDX[o.status]<SIDX.sent&&o.ship_by<todayStr();
const stageLabel=k=>k==="cancel"?"Отменён":(STAGES.find(s=>s.k===k)||{}).t||k;
function leds(o){
  if(o.status==="cancel")return `<span class="pill p-bad">Отменён</span>`;
  const i=SIDX[o.status];
  return `<span class="leds" title="${esc(stageLabel(o.status))}" aria-label="Этап: ${esc(stageLabel(o.status))}">${STAGES.map((s,j)=>`<i class="${j<i?"on":j===i?"cur":""}"></i>`).join("")}</span>`;
}
function payPill(o){const st=o.pay_status||"wait";return `<span class="pill ${st==="paid"?"p-ok":st==="partial"?"p-warn":"p-bad"}">${PAYST[st]}</span>`}
function reservedMap(){
  const m={};
  for(const o of S.orders.values()){
    if(o.stock_deducted||o.status==="cancel")continue;
    for(const it of o.items||[])if(it.stock_id)m[it.stock_id]=(m[it.stock_id]||0)+(+it.qty||1);
  }
  return m;
}

/* ---------- loading data ---------- */
async function fetchAll(table,build){
  let out=[],from=0;const size=1000;
  for(;;){const rows=await q(build(sb.from(table)).range(from,from+size-1));out=out.concat(rows);if(rows.length<size)break;from+=size}
  return out;
}
const loaders={
  async orders(){const rows=await fetchAll("orders",t=>t.select("*").order("created_at",{ascending:false}));S.orders=new Map(rows.map(r=>[r.id,r]))},
  async stock(){const rows=await fetchAll("stock",t=>t.select("*").order("name"));S.stock=new Map(rows.map(r=>[r.id,r]))},
  async logs(){S.logs=await q(sb.from("stock_log").select("*").order("id",{ascending:false}).limit(60))},
  async profiles(){const rows=await q(sb.from("profiles").select("*").order("created_at"));S.profiles=new Map(rows.map(r=>[r.id,r]))},
  async changes(){const rows=await q(sb.from("order_events").select("*").eq("kind","change").eq("ack",false).order("id"));const m=new Map();rows.forEach(r=>{if(!m.has(r.order_id))m.set(r.order_id,[]);m.get(r.order_id).push(r)});S.changes=m},
  async settings(){const rows=await q(sb.from("settings").select("*"));const c=rows.find(r=>r.key==="commissions");S.settings={commissions:{...DEFAULT_COMM,...(c?c.value:{})}}},
  async events(){if(!S.modal||S.modal.type!=="order")return;const id=S.modal.id;S.events.set(id,await q(sb.from("order_events").select("*").eq("order_id",id).order("id")))}
};
const ALL=["orders","stock","logs","profiles","changes","settings","events"];
const pending=new Set();let reloadTimer=null;
function reload(...names){if(S.phase!=="app")return;names.forEach(n=>pending.add(n));clearTimeout(reloadTimer);reloadTimer=setTimeout(flush,150)}
async function flush(){
  const names=[...pending];pending.clear();
  try{await Promise.all(names.map(n=>loaders[n]()));S.loadError=null}
  catch(e){console.error(e);S.loadError=errText(e)}
  if(names.includes("profiles")&&!checkMe())return;
  render();
}
function checkMe(){
  const me=S.profiles.get(S.uid);
  if(!me||!me.role||!me.active){S.phase="noaccess";stopLive();closeModal();render();return false}
  S.me=me;S.role=me.role;fixTab();return true;
}
function startLive(){
  stopLive();
  channel=sb.channel("teb-live");
  const on=(table,fn)=>channel.on("postgres_changes",{event:"*",schema:"public",table},fn);
  on("orders",()=>reload("orders"));
  on("order_events",p=>{reload("changes");const oid=(p.new&&p.new.order_id)||(p.old&&p.old.order_id);if(S.modal&&S.modal.type==="order"&&(!oid||oid===S.modal.id))reload("events")});
  on("stock",()=>reload("stock"));
  on("stock_log",()=>reload("logs"));
  on("profiles",()=>reload("profiles"));
  on("settings",()=>reload("settings"));
  channel.subscribe(st=>{
    const was=S.live;S.live=st==="SUBSCRIBED";
    if(S.live&&!was)reload(...ALL);      // catch up on anything missed while offline
    else if(was!==S.live)render();
  });
}
function stopLive(){if(channel){sb.removeChannel(channel);channel=null}S.live=false}
setInterval(()=>{if(S.phase==="app"&&!document.hidden)reload(...ALL)},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.phase==="app")reload(...ALL)});

/* ---------- sign-in ---------- */
async function boot(){
  if(!window.supabase){$("#root").innerHTML=`<div class="center"><h2>Страница не загрузилась</h2><p class="muted">Проверьте интернет и обновите страницу.</p></div>`;return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange(ev=>{
    if(ev==="SIGNED_OUT")setTimeout(()=>{stopLive();S.uid=null;S.me=null;S.role=null;closeModal();toLogin()},0);
  });
  let session=null;
  try{const {data}=await sb.auth.getSession();session=data&&data.session}catch(e){}
  if(session)await start(session);else await toLogin();
}
async function toLogin(){
  S.phase="loading";render();
  try{S.phase=(await q(sb.rpc("has_admin")))?"login":"setup"}catch(e){S.phase="login"}
  render();
}
async function start(session){
  S.uid=session.user.id;S.phase="loading";render();
  try{
    await loaders.profiles();
    if(!checkMe())return;
    await Promise.all([loaders.orders(),loaders.stock(),loaders.logs(),loaders.changes(),loaders.settings()]);
    S.phase="app";S.loadError=null;
  }catch(e){console.error(e);S.phase="error";S.loadError=errText(e)}
  render();
  if(S.phase==="app")startLive();
}
const loginEmail=l=>{l=l.trim();return l.includes("@")?l:`${l.toLowerCase()}@${LOGIN_DOMAIN}`};
async function signIn(login,password){
  const {data,error}=await sb.auth.signInWithPassword({email:loginEmail(login),password});
  if(error)throw error;
  await start(data.session);
}

/* ----- reports ----- */
function periodRange(){
  const p=S.f.period,now=new Date();let from=null,to=null;
  const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(p==="today")from=sod(now);
  else if(p==="week")from=new Date(sod(now).getTime()-6*864e5);
  else if(p==="month")from=new Date(now.getFullYear(),now.getMonth(),1);
  else if(p==="prev"){from=new Date(now.getFullYear(),now.getMonth()-1,1);to=new Date(now.getFullYear(),now.getMonth(),1)}
  else if(p==="year")from=new Date(now.getFullYear(),0,1);
  else if(p==="custom"){from=S.f.from?new Date(S.f.from+"T00:00"):null;to=S.f.to?new Date(new Date(S.f.to+"T00:00").getTime()+864e5):null}
  return {from,to};
}
function reportsView(){
  const {from,to}=periodRange();
  const all=[...S.orders.values()].filter(o=>o.status!=="cancel");
  const inP=all.filter(o=>{const d=new Date(o.created_at);return (!from||d>=from)&&(!to||d<to)});
  const sum=f=>inP.reduce((a,o)=>a+f(o),0);
  const rev=sum(o=>+o.price||0),cost=sum(orderCost),comm=sum(orderComm),dl=sum(o=>+o.deliv_cost||0),prof=rev-cost-comm-dl;
  const debt=all.reduce((a,o)=>a+Math.max(0,(+o.price||0)-(+o.paid||0)),0);
  const inWork=all.filter(o=>SIDX[o.status]<SIDX.sent).length;
  const group=key=>{const m={};inP.forEach(o=>{const k=key(o)||"—";m[k]=m[k]||{n:0,rev:0,prof:0};m[k].n++;m[k].rev+=+o.price||0;m[k].prof+=orderProfit(o)});return Object.entries(m).sort((a,b)=>b[1].rev-a[1].rev)};
  const tbl=(rows,label,nameFn=k=>k)=>{const max=Math.max(1,...rows.map(r=>r[1].rev));return rows.length?`<table><thead><tr><th>${label}</th><th class="num">Заказов</th><th class="num">Выручка</th><th class="num">Прибыль</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${esc(nameFn(k))}<div class="bar" style="margin-top:6px"><i style="width:${v.rev/max*100}%"></i></div></td><td class="num">${v.n}</td><td class="num">${money(v.rev)}</td><td class="num">${money(v.prof)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty small">Нет продаж за период</div>`};
  const days={};inP.forEach(o=>{const k=ymd(new Date(o.created_at));days[k]=(days[k]||0)+(+o.price||0)});
  const dk=Object.keys(days).sort();const dmax=Math.max(1,...Object.values(days));

  const parts={};inP.forEach(o=>(o.items||[]).forEach(i=>{parts[i.name]=(parts[i.name]||0)+(+i.qty||1)}));
  const topParts=Object.entries(parts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const debtors=all.filter(o=>(+o.price||0)>(+o.paid||0)).sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||""));
  const box=(title,inner)=>`<div class="tbl-wrap"><div style="padding:14px 14px 0"><h2>${title}</h2></div>${inner}</div>`;
  return `<div class="head"><h1>Отчёты</h1>
    <select class="in" style="width:auto" data-f="period" aria-label="Период">${[["today","Сегодня"],["week","7 дней"],["month","Этот месяц"],["prev","Прошлый месяц"],["year","Этот год"],["all","Всё время"],["custom","Свой период"]].map(([k,t])=>`<option value="${k}" ${S.f.period===k?"selected":""}>${t}</option>`).join("")}</select>
    ${S.f.period==="custom"?`<input class="in" style="width:auto" type="date" value="${S.f.from}" data-f="from" aria-label="С"><input class="in" style="width:auto" type="date" value="${S.f.to}" data-f="to" aria-label="По">`:""}
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">Выручка</div><div class="v">${money(rev)}</div></div>
    <div class="kpi"><div class="l">Чистая прибыль</div><div class="v" style="color:${prof<0?"var(--bad)":"var(--ok)"}">${money(prof)}</div></div>
    <div class="kpi"><div class="l">Продано ПК</div><div class="v">${inP.length}</div></div>
    <div class="kpi"><div class="l">Средний чек</div><div class="v">${money(inP.length?rev/inP.length:0)}</div></div>
    <div class="kpi"><div class="l">В работе сейчас</div><div class="v">${inWork}</div></div>
    <div class="kpi"><div class="l">Не доплачено клиентами</div><div class="v" style="color:${debt?"var(--warn)":"inherit"}">${money(debt)}</div></div>
  </div>
  <div class="panel" style="margin-bottom:14px"><h2>Из чего складывается прибыль</h2>
    <dl class="kv"><dt>Выручка</dt><dd>${money(rev)}</dd><dt>Комплектующие</dt><dd>− ${money(cost)}</dd><dt>Комиссии оплаты</dt><dd>− ${money(comm)} <span class="muted small">(проценты — во вкладке «Команда»)</span></dd><dt>Доставка</dt><dd>− ${money(dl)}</dd><dt><b>Прибыль</b></dt><dd><b>${money(prof)}</b> · маржа ${rev?Math.round(prof/rev*100):0}%</dd></dl></div>
  <div class="panel" style="margin-bottom:14px"><h2>Выручка по дням</h2>${chart}</div>
  <div class="two">
    ${box("По способу оплаты",tbl(group(o=>o.pay_method),"Способ"))}
    ${box("По менеджерам",tbl(group(o=>o.manager_id),"Менеджер",nm))}
    ${box("По каналам продаж",tbl(group(o=>o.channel),"Канал"))}
    ${box("По городам",tbl(group(o=>o.city),"Город"))}
    ${box("Чаще всего продаются",topParts.length?`<table><tbody>${topParts.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v} шт</td></tr>`).join("")}</tbody></table>`:`<div class="empty small">Нет данных</div>`)}
    ${box("Ожидаем оплату",debtors.length?`<table><tbody>${debtors.map(o=>`<tr class="click" data-open="${o.id}"><td><b>${onum(o)}</b> ${esc(o.client)}<div class="small muted">${esc(o.pay_method)}</div></td><td class="num">${money((+o.price||0)-(+o.paid||0))}</td></tr>`).join("")}</tbody></table>`:`<div class="empty small">Все заказы оплачены</div>`)}
  </div>`;
}

/* ---------- side sheet ---------- */
function openModal(m){S.modal=m;renderModal(true)}
function closeModal(){S.modal=null;$("#modal").innerHTML=""}
function renderModal(force){
  const el=$("#modal");
  if(!S.modal){el.innerHTML="";return}
  const ae=document.activeElement;
  // never wipe a form, or a field someone is typing in
  if(!force&&(S.modal.form||(el.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.type!=="checkbox")))return;
  const sc=el.querySelector(".sheet")?.scrollTop||0;
  let html="";
  if(S.modal.type==="order")html=orderDetail(S.orders.get(S.modal.id));
  else if(S.modal.type==="orderForm")html=orderForm(S.modal.id?S.orders.get(S.modal.id):null);
  else if(S.modal.type==="stockForm")html=stockForm(S.modal.id?S.stock.get(S.modal.id):null);
  else if(S.modal.type==="move")html=moveForm(S.stock.get(S.modal.id),S.modal.dir);
  else if(S.modal.type==="pwd")html=pwdForm(S.profiles.get(S.modal.id));
  if(!html){closeModal();return}
  el.innerHTML=`<div class="scrim" data-close="1"><div class="sheet ${S.modal.narrow?"narrow":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const sh=el.querySelector(".sheet");
  if(!force)sh.scrollTop=sc;
  else{const f=sh.querySelector("form input:not([type=checkbox]),form select,form textarea");if(f&&S.modal.form)f.focus();else sh.querySelector("button")?.focus()}
}
function openOrder(id){S.modal={type:"order",id};renderModal(true);reload("events")}

  const shopStaff=[...S.profiles.values()].filter(p=>(p.active&&["lead","assembler"].includes(p.role))||p.id===o.assignee);

  ${cancelled?`<div class="alert bad"><b>Заказ отменён</b></div>`:`<div class="stage-line">${STAGES.map((s,j)=>`<div class="${j<i?"on":j===i?"cur":""}">${s.t}</div>`).join("")}</div>`}
  ${ch.length&&!cancelled?`<div class="alert bad"><div style="flex:1"><b>Менеджер изменил заказ</b>${ch.map(c=>`<div class="small" style="margin-top:4px">${fdt(c.created_at)} · ${esc(nm(c.actor))}: ${esc(c.body)}</div>`).join("")}</div>${can.shop()?`<button class="btn sm dark" data-ack="${o.id}">Увидел, учту</button>`:""}</div>`:""}

    ${prev&&can.shop()?`<button class="btn" data-prev="${o.id}">Вернуть на «${prev.t}»</button>`:""}
    ${can.sell()&&!cancelled&&i<SIDX.sent?`<button class="btn bad ghost" data-cancel="${o.id}">Отменить заказ</button>`:""}
    ${can.sell()&&cancelled?`<button class="btn" data-restore="${o.id}">Восстановить</button>`:""}
    ${S.role==="admin"&&cancelled?`<button class="btn bad ghost" data-delorder="${o.id}">Удалить навсегда</button>`:""}
  </div>
  ${blockReady&&can.shop()?`<div class="alert warn small">Чтобы отметить «Готов к отправке», закройте все пункты чек-листа комплектации ниже.</div>`:""}

      <dt>Город</dt><dd>${esc(o.city)}</dd><dt>Адрес</dt><dd>${esc(o.address)||"—"}</dd>
      <dt>Доставка</dt><dd>${esc(DELIV[o.deliv]||"—")}</dd><dt>Отправить до</dt><dd>${fd(o.ship_by)}</dd>
      ${o.tracking?`<dt>Отправка</dt><dd>${esc(o.tracking)}</dd>`:""}
    </dl>

    </div>
    <div class="panel"><h2>Деньги</h2><dl class="kv">
      <dt>Цена продажи</dt><dd><b>${money(o.price)}</b></dd><dt>Способ</dt><dd>${esc(o.pay_method)}</dd>

  </div>
  <div class="panel sec"><h2>История</h2>
    ${ev?history.map(h=>h.kind==="status"
      ?`<div class="small" style="padding:4px 0"><span class="muted">${fdt(h.created_at)}</span> · ${esc(nm(h.actor))} → <b>${esc(stageLabel(h.status))}</b></div>`
      :`<div class="small" style="padding:4px 0"><span class="muted">${fdt(h.created_at)}</span> · ${esc(nm(h.actor))} изменил заказ: ${esc(h.body)} ${h.ack?`<span class="pill p-ok">подтвердил ${esc(nm(h.ack_by))}</span>`:`<span class="pill p-bad">не подтверждено</span>`}</div>`).join(""):`<div class="muted small">Загрузка…</div>`}

    <div class="items-row small muted" style="font-weight:600"><span>Позиция</span><span>Кол-во</span><span>Себест., ₸</span><span></span></div>
    <div id="items">${S.modal.items.map((it,j)=>itemRow(it,j)).join("")}</div>
    <datalist id="stocklist">${stockOpts.map(s=>`<option value="${esc(s.name)}">${esc(s.cat||"")} · свободно ${(+s.qty||0)-(res[s.id]||0)}</option>`).join("")}</datalist>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" data-additem="1">Добавить позицию</button><span class="small muted" id="costSum">Себестоимость: ${money(S.modal.items.reduce((a,i)=>a+(+i.cost||0)*(+i.qty||1),0))}</span></div>
    <p class="small muted" style="margin:8px 0 0">Начните вводить название и выберите позицию со склада — себестоимость подставится сама. Позиции не со склада тоже можно вписать.</p>
  </div>
  <div class="panel sec"><h2>Оплата</h2><div class="grid3">
    <label class="f">Цена продажи, ₸<input class="in" type="number" min="0" name="price" required value="${e.price??""}"></label>
    <label class="f">Способ оплаты<select class="in" name="pay_method">${PAY.map(p=>`<option ${e.pay_method===p?"selected":""}>${p}</option>`).join("")}</select></label>
    <label class="f">Статус оплаты<select class="in" name="pay_status">${Object.entries(PAYST).map(([k,t])=>`<option value="${k}" ${e.pay_status===k?"selected":""}>${t}</option>`).join("")}</select></label>
    <label class="f">Получено, ₸<input class="in" type="number" min="0" name="paid" value="${o?(e.paid??""):""}" placeholder="при «Оплачено» — вся сумма"></label>
    <label class="f">Когда получены<input class="in" type="datetime-local" name="paid_at" value="${toLocalInput(e.paid_at||(o?"":new Date().toISOString()))}"></label>
    <label class="f">От кого<input class="in" name="payer" value="${esc(e.payer||"")}" placeholder="ФИО плательщика"></label>
  </div></div>
  <div class="panel sec"><h2>Для цеха</h2>
    <label class="f">Пожелания и особенности сборки<textarea class="in" name="note" placeholder="Подсветка, кабель-менеджмент, программы клиента, язык Windows…">${esc(e.note||"")}</textarea></label>
    ${inShop?`<label class="f" style="margin-top:10px">Что изменилось — коротко для сборщиков<input class="in" name="change_text" placeholder="Например: заменили SSD на 2 ТБ, доплата получена"></label>`:""}
  </div>
  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
    <button class="btn pri" type="submit" value="save">${o?"Сохранить изменения":"Сохранить заказ"}</button>
    ${!o?`<button class="btn dark" type="submit" value="queue">Сохранить и передать в цех</button>`:""}
    <button class="btn ghost" type="button" data-close="1">Отмена</button>
  </div></form>`;
}
function itemRow(it,j){
  return `<div class="items-row" data-row="${j}"><input class="in" list="stocklist" placeholder="Например: RTX 4060" value="${esc(it.name)}" data-iname="${j}" aria-label="Позиция"><input class="in" type="number" min="1" step="1" value="${+it.qty||1}" data-iqty="${j}" aria-label="Количество"><input class="in" type="number" min="0" value="${+it.cost||0}" data-icost="${j}" aria-label="Себестоимость"><button type="button" class="btn sm ghost" data-delitem="${j}" aria-label="Удалить позицию">✕</button></div>`;
}
function stockByName(name){name=name.trim().toLowerCase();return [...S.stock.values()].find(s=>s.name.trim().toLowerCase()===name)}
function readItemsFromDom(){
  return [...document.querySelectorAll("#items .items-row")].map(r=>{
    const j=r.dataset.row;const name=r.querySelector(`[data-iname="${j}"]`).value.trim();const st=stockByName(name);
    return {stock_id:st?st.id:"",name:st?st.name:name,qty:Math.max(1,Math.round(+r.querySelector(`[data-iqty="${j}"]`).value||1)),cost:+r.querySelector(`[data-icost="${j}"]`).value||0};
  });
}
function updCost(){const el=$("#costSum");if(el)el.textContent="Себестоимость: "+money(readItemsFromDom().reduce((a,i)=>a+i.cost*i.qty,0))}

function stockForm(s){
  S.modal.form=true;S.modal.narrow=true;const e=s||{cat:CATS[0],min_qty:1,cost:0};
  return `<div class="sheet-head"><h1 style="flex:1">${s?"Изменить позицию":"Новая позиция"}</h1><button class="btn ghost" data-close="1" aria-label="Закрыть">✕</button></div>
  <form id="stockForm" class="panel sec" style="display:grid;gap:12px">
    <label class="f">Наименование<input class="in" name="name" required value="${esc(e.name||"")}" placeholder="RTX 4060 8GB"></label>
    <label class="f">Категория<select class="in" name="cat">${CATS.map(c=>`<option ${e.cat===c?"selected":""}>${c}</option>`).join("")}</select></label>
    <label class="f">Артикул / серия (необязательно)<input class="in" name="sku" value="${esc(e.sku||"")}"></label>
    <div class="grid2">
      ${s?"":`<label class="f">Начальный остаток, шт<input class="in" type="number" min="0" step="1" name="qty" value="0"></label>`}
      <label class="f">Себестоимость, ₸<input class="in" type="number" min="0" name="cost" value="${+e.cost||0}"></label>
      <label class="f">Минимальный остаток<input class="in" type="number" min="0" step="1" name="min_qty" value="${+e.min_qty||0}"></label>
    </div>
    ${s?`<p class="small muted" style="margin:0">Количество меняется только приходом и списанием — так каждое движение попадает в журнал.</p>`:""}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="submit">Сохранить</button>${s?`<button class="btn bad ghost" type="button" data-delstock="${s.id}">Удалить позицию</button>`:""}</div>
  </form>`;
}
function moveForm(s,dir){
  if(!s)return"";S.modal.form=true;S.modal.narrow=true;
  return `<div class="sheet-head"><h1 style="flex:1">${dir==="in"?"Приход":"Списание"}</h1><button class="btn ghost" data-close="1" aria-label="Закрыть">✕</button></div>
  <p><b>${esc(s.name)}</b> <span class="muted">· сейчас ${+s.qty||0} шт</span></p>
  <form id="moveForm" class="panel" style="display:grid;gap:12px">
    <label class="f">Количество, шт<input class="in" type="number" min="1" step="1" name="n" required value="1"></label>
    ${dir==="in"?`<label class="f">Цена закупки за шт, ₸ (обновит себестоимость)<input class="in" type="number" min="0" name="cost" value="${+s.cost||0}"></label><label class="f">Поставщик / комментарий<input class="in" name="note" placeholder="Например: поставщик, № накладной"></label>`
    :`<label class="f">Причина<select class="in" name="note"><option>Брак / возврат поставщику</option><option>Гарантийная замена</option><option>Продажа отдельно</option><option>Инвентаризация</option><option>Другое</option></select></label>`}
    <button class="btn pri" type="submit">${dir==="in"?"Оприходовать":"Списать"}</button>
  </form>`;
}
function pwdForm(p){
  if(!p)return"";S.modal.form=true;S.modal.narrow=true;
  return `<div class="sheet-head"><h1 style="flex:1">Новый пароль</h1><button class="btn ghost" data-close="1" aria-label="Закрыть">✕</button></div>
  <p>${esc(p.name)} <span class="muted">· логин ${esc(p.login)}</span></p>
  <form id="pwdForm" class="panel" style="display:grid;gap:12px">
    <label class="f">Новый пароль<input class="in" name="password" required minlength="6" autocomplete="new-password"></label>
    <button class="btn pri" type="submit">Сохранить пароль</button>
  </form>`;
}

/* ---------- actions ---------- */
const setStatus=(o,status,ok)=>act(()=>q(sb.from("orders").update({status}).eq("id",o.id)),ok||stageLabel(status),"orders","stock","logs","events");
function orderDiff(old,data){
  const lbl={client:"клиент",phone:"телефон",city:"город",address:"адрес",ship_by:"дата отправки",note:"пожелания",deliv:"доставка"};
  const d=[];
  for(const k in lbl)if((old[k]||"")!==(data[k]||""))d.push(lbl[k]+": "+(k==="deliv"?DELIV[data[k]]:k==="ship_by"?fd(data[k]):data[k]||"—"));
  const a=cfgLine(old),b=cfgLine({items:data.items});if(a!==b)d.push("комплектующие: "+b);
  return d;
}
async function saveOrderForm(form,go){
  const fdx=new FormData(form);const v=k=>(fdx.get(k)||"").toString().trim();
  const items=readItemsFromDom().filter(i=>i.name);
  const price=+v("price")||0;const pay_status=v("pay_status");
  const paid=v("paid")===""?(pay_status==="paid"?price:0):+v("paid");
  const data={channel:v("channel"),kaspi_no:v("kaspi_no"),ship_by:v("ship_by")||null,client:v("client"),phone:v("phone"),city:v("city"),address:v("address"),
    deliv:v("deliv"),deliv_cost:+v("deliv_cost")||0,items,price,pay_method:v("pay_method"),pay_status,paid,paid_at:fromLocalInput(v("paid_at")),payer:v("payer"),note:v("note")};
  const old=S.modal.id?S.orders.get(S.modal.id):null;
  if(!old){
    const status=go==="queue"?"queue":"new";
    const row=await act(()=>q(sb.from("orders").insert({...data,status}).select().single()),status==="queue"?"Заказ передан в цех":"Заказ сохранён","orders","stock");
    if(row){S.orders.set(row.id,row);closeModal();render()}
    return;
  }
  const diffs=orderDiff(old,data);const txt=v("change_text");
  const notify=old.status!=="cancel"&&SIDX[old.status]>=SIDX.queue&&(txt||diffs.length);
  const ok=await act(async()=>{
    await q(sb.from("orders").update(data).eq("id",old.id));
    if(notify)await q(sb.from("order_events").insert({order_id:old.id,kind:"change",actor:S.uid,body:(txt?txt+(diffs.length?" — ":""):"")+diffs.join("; ")}));
  },"Изменения сохранены","orders","changes","stock","logs");
  if(ok){S.modal={type:"order",id:old.id};renderModal(true);reload("events")}
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-open],[data-act],[data-close],[data-edit],[data-next],[data-prev],[data-cancel],[data-restore],[data-delorder],[data-ack],[data-take],[data-comment],[data-additem],[data-delitem],[data-move],[data-editstock],[data-delstock],[data-shop],[data-pwd],[data-active]");
  if(!t)return;const d=t.dataset;
  if(d.close&&t.classList.contains("scrim")&&e.target!==t)return; // clicks inside the sheet don't close it
  if(d.tab){S.tab=d.tab;history.replaceState(null,"","#"+d.tab);render();window.scrollTo(0,0);return}
  if(d.shop){S.f.shop=d.shop;render();return}
  if(d.close){closeModal();return}
  if(d.open){openOrder(d.open);return}
  if(d.act==="logout"){await sb.auth.signOut();return}
  if(d.act==="retry"){const {data}=await sb.auth.getSession();if(data&&data.session)start(data.session);else toLogin();return}
  if(d.act==="newOrder"){openModal({type:"orderForm"});return}
  if(d.act==="newStock"){openModal({type:"stockForm"});return}
  if(d.act==="saveComm"){const c={};document.querySelectorAll("[data-comm]").forEach(i=>c[i.dataset.comm]=+i.value||0);await act(()=>q(sb.from("settings").upsert({key:"commissions",value:c})),"Проценты сохранены","settings");return}
  if(d.edit){openModal({type:"orderForm",id:d.edit});return}
  if(d.pwd){openModal({type:"pwd",id:d.pwd});return}
  if(d.active){const p=S.profiles.get(d.active);if(!p)return;
    if(p.active&&!confirm(`Отключить доступ: ${p.name}? Сотрудник больше не сможет войти, его заказы и история сохранятся.`))return;
    await act(()=>team({action:"active",user_id:p.id,active:!p.active}),p.active?"Доступ отключён":"Доступ включён","profiles");return}
  const o=S.orders.get(d.next||d.prev||d.cancel||d.restore||d.delorder||d.ack||d.take||d.comment);
  if(d.next&&o){const n=STAGES[SIDX[o.status]+1];if(n){t.disabled=true;await setStatus(o,n.k,n.k==="queue"?"Заказ передан в цех":null)}return}
  if(d.prev&&o){const p=STAGES[SIDX[o.status]-1];if(p){t.disabled=true;await setStatus(o,p.k)}return}
  if(d.cancel&&o){if(confirm(`Отменить заказ ${onum(o)}? Списанные комплектующие вернутся на склад.`))await setStatus(o,"cancel");return}
  if(d.restore&&o){await setStatus(o,"new","Заказ восстановлен");return}
  if(d.delorder&&o){if(confirm(`Удалить заказ ${onum(o)} навсегда? Его нельзя будет восстановить.`)){if(await act(()=>q(sb.from("orders").delete().eq("id",o.id)),"Заказ удалён","orders","changes")){S.orders.delete(o.id);closeModal();render()}}return}
  if(d.ack&&o){await act(()=>q(sb.rpc("ack_changes",{p_order:o.id})),"Изменение подтверждено","changes","events");return}
  if(d.take&&o){await act(()=>q(sb.from("orders").update({assignee:S.uid}).eq("id",o.id)),"Заказ за вами","orders");return}
  if(d.comment&&o){const i=$("#cmt");const v=i.value.trim();if(!v)return;
    if(await act(()=>q(sb.from("order_events").insert({order_id:o.id,kind:"comment",actor:S.uid,body:v})),null,"events")){i.value="";i.blur()}return}
  if(d.additem){S.modal.items=readItemsFromDom();S.modal.items.push({name:"",qty:1,cost:0,stock_id:""});$("#items").innerHTML=S.modal.items.map((it,j)=>itemRow(it,j)).join("");$(`[data-iname="${S.modal.items.length-1}"]`).focus();return}
  if(d.delitem){S.modal.items=readItemsFromDom();S.modal.items.splice(+d.delitem,1);$("#items").innerHTML=S.modal.items.map((it,j)=>itemRow(it,j)).join("");updCost();return}
  if(d.move){openModal({type:"move",id:d.id,dir:d.move});return}
  if(d.editstock){openModal({type:"stockForm",id:d.editstock});return}
  if(d.delstock){if(confirm("Удалить позицию со склада? Журнал движений сохранится.")){if(await act(()=>q(sb.from("stock").delete().eq("id",d.delstock)),"Позиция удалена","stock"))closeModal()}return}
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f&&t.type==="search"){S.f[t.dataset.f]=t.value;const pos=t.selectionStart;render();const n=document.querySelector(`[data-f="${t.dataset.f}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(t.dataset.iname!==undefined){const s=stockByName(t.value);if(s){const c=document.querySelector(`[data-icost="${t.dataset.iname}"]`);if(c&&!+c.value)c.value=s.cost||0}updCost();return}
  if(t.dataset.iqty!==undefined||t.dataset.icost!==undefined)updCost();
});
document.addEventListener("change",async e=>{
  const t=e.target;const d=t.dataset;
  if(d.f&&t.type!=="search"){S.f[d.f]=t.value;render();return}
  if(d.prole){await act(()=>q(sb.from("profiles").update({role:t.value}).eq("id",d.prole)),"Роль изменена","profiles");return}
  if(d.pname){const v=t.value.trim();if(v)await act(()=>q(sb.from("profiles").update({name:v}).eq("id",d.pname)),"Имя сохранено","profiles");return}
  const o=S.orders.get(d.id||d.assign);if(!o)return;
  if(d.check!==undefined){t.closest(".check")?.classList.toggle("done",t.checked);await act(()=>q(sb.rpc("set_check",{p_order:o.id,p_field:"checks",p_key:d.check,p_val:t.checked})),null,"orders");return}
  if(d.icheck!==undefined){t.closest(".check")?.classList.toggle("done",t.checked);await act(()=>q(sb.rpc("set_check",{p_order:o.id,p_field:"item_checks",p_key:d.icheck,p_val:t.checked})),null,"orders");return}
  if(d.flag){await act(()=>q(sb.from("orders").update({[d.flag]:t.checked}).eq("id",o.id)),null,"orders");return}
  if(d.field){const v=t.value.trim();if((o[d.field]||"")!==v)await act(()=>q(sb.from("orders").update({[d.field]:v}).eq("id",o.id)),"Сохранено","orders");return}
  if(d.assign){await act(()=>q(sb.from("orders").update({assignee:t.value||null}).eq("id",o.id)),"Ответственный назначен","orders");return}
});
document.addEventListener("focusout",e=>{
  if(S.modal&&!S.modal.form&&e.target.closest&&e.target.closest("#modal"))setTimeout(()=>{if(!$("#modal").contains(document.activeElement))renderModal(false)},60);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.modal)closeModal();
  if(e.key==="Enter"&&e.target.id==="cmt"){e.preventDefault();document.querySelector("[data-comment]")?.click()}
});
function formBusy(f,b){f.querySelectorAll("button").forEach(x=>x.disabled=b)}
function formErr(f,msg){const el=f.querySelector(".form-err");if(el)el.textContent=msg||""}
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const fdx=new FormData(f);const v=k=>(fdx.get(k)||"").toString().trim();
  if(f.id==="loginForm"){formErr(f,"");formBusy(f,true);try{await signIn(v("login"),fdx.get("password")||"")}catch(err){formErr(f,errText(err));formBusy(f,false)}return}
  if(f.id==="setupForm"){
    formErr(f,"");const p1=fdx.get("password")||"",p2=fdx.get("password2")||"";
    if(p1!==p2){formErr(f,"Пароли не совпадают");return}
    formBusy(f,true);
    try{await team({action:"bootstrap",name:v("name"),login:v("login"),password:p1});await signIn(v("login"),p1)}
    catch(err){formErr(f,errText(err));formBusy(f,false)}
    return}
  if(f.id==="orderForm"){formBusy(f,true);await saveOrderForm(f,e.submitter?.value||"save");if(document.body.contains(f))formBusy(f,false);return}
  if(f.id==="stockForm"){
    const old=S.modal.id?S.stock.get(S.modal.id):null;
    const data={name:v("name"),cat:v("cat"),sku:v("sku"),cost:+v("cost")||0,min_qty:Math.max(0,Math.round(+v("min_qty")||0))};
    formBusy(f,true);
    const ok=await act(async()=>{
      if(old){await q(sb.from("stock").update(data).eq("id",old.id));return}
      const row=await q(sb.from("stock").insert(data).select().single());
      const n=Math.max(0,Math.round(+v("qty")||0));
      if(n)await q(sb.rpc("stock_move",{p_stock:row.id,p_delta:n,p_note:"Начальный остаток"}));
    },old?"Позиция обновлена":"Позиция добавлена","stock","logs");
    if(ok)closeModal();else formBusy(f,false);
    return}
  if(f.id==="moveForm"){
    const s=S.stock.get(S.modal.id);const dir=S.modal.dir;const n=Math.max(1,Math.round(+v("n")||1));
    if(dir==="out"&&n>(+s.qty||0)&&!confirm("Списываете больше, чем числится на складе. Продолжить?"))return;
    const note=(dir==="in"?"Приход":"Списание")+(v("note")?": "+v("note"):"");
    formBusy(f,true);
    const ok=await act(()=>q(sb.rpc("stock_move",{p_stock:s.id,p_delta:dir==="in"?n:-n,p_note:note,p_cost:dir==="in"?(+v("cost")||0):null})),dir==="in"?"Оприходовано":"Списано","stock","logs");
    if(ok)closeModal();else formBusy(f,false);
    return}
  if(f.id==="staffForm"){
    formBusy(f,true);
    const login=v("login").toLowerCase();
    const ok=await act(()=>team({action:"create",name:v("name"),login,password:fdx.get("password")||"",role:v("role")}),`Сотрудник добавлен. Логин: ${login}`,"profiles");
    if(ok)f.reset();formBusy(f,false);
    return}
  if(f.id==="pwdForm"){
    formBusy(f,true);
    const ok=await act(()=>team({action:"password",user_id:S.modal.id,password:fdx.get("password")||""}),"Пароль изменён");
    if(ok)closeModal();else formBusy(f,false);
    return}
});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(S.phase==="app"&&tabsFor().some(x=>x[0]===t)){S.tab=t;render()}});

boot();
</script>
</body>
